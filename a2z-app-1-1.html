<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A2Z Solutions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#F2F6FC;--card:#fff;--ink:#0B1B3A;--mute:#5B6B88;--line:#DCE6F3;--b1:#1B4FA8;--b2:#2E86F0;--ok:#16794A;--bad:#C0392B;--am:#D97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1428;--card:#122243;--ink:#EAF1FF;--mute:#9DB1D3;--line:#223559;--ok:#4FD08A;--bad:#FF8A7E;--am:#F5B84A}}
:root[data-theme="dark"]{--bg:#0A1428;--card:#122243;--ink:#EAF1FF;--mute:#9DB1D3;--line:#223559;--ok:#4FD08A;--bad:#FF8A7E;--am:#F5B84A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Sora,"Segoe UI",Roboto,system-ui,sans-serif;max-width:520px;margin-inline:auto;min-height:100vh}
body.ur,body.ur *{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
body.ur{line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0B2A63;z-index:10}
header{background:radial-gradient(120% 100% at 50% 0%,#2E6FD0 0%,#173F8A 50%,#0B2A63 100%);color:#fff;text-align:center;padding:16px 18px 28px;border-radius:0 0 30px 30px}
.langs{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
.langs button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.langs button.on{background:#fff;color:#0B2A63;border-color:#fff;font-weight:700}
.mark{display:grid;place-items:center;margin:4px auto 12px}
.logo{width:140px;height:140px;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 0 0 6px rgba(255,255,255,.18),0 14px 36px rgba(0,0,0,.35)}
h1{margin:0;font-size:25px;font-weight:800;letter-spacing:.4px}
header p{margin:4px 0 0;color:#BBD7FF;font-size:14px}
main{padding:18px 16px 96px}
h2{font-size:17px;font-weight:700;margin:20px 0 12px}
.cta{display:flex;gap:10px}
.cta a{flex:1;text-align:center;text-decoration:none;padding:12px 8px;border-radius:14px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2))}
.cta a.w{background:#1FA855}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hud div{background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:center;padding:8px 4px}
.hud b{display:block;font-size:19px;color:var(--b2)}
.hud span{font-size:11px;letter-spacing:1px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:start;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(20,60,130,.1)}
.svc:last-child{grid-column:1/-1;flex-direction:row;align-items:center}
.svc:active{transform:scale(.97)}
.svc .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:rgba(46,134,240,.12);border:1px solid rgba(46,134,240,.25)}
.svc strong{font-size:14px;line-height:1.3}
nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin-inline:auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:13px 0;font:inherit;font-size:14px;color:var(--mute);cursor:pointer}
nav button.on{color:var(--b2);font-weight:700;box-shadow:inset 0 3px 0 var(--b2)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:70px}
.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink);margin-top:8px;font-weight:600}
.order{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;border-inline-start:5px solid var(--b2)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.new{color:var(--am)}.pill.done{color:var(--ok)}.pill.accepted,.pill.ontheway,.pill.working{color:var(--b2)}.pill.cancel{color:var(--bad)}
.mute{color:var(--mute);font-size:14px}
.link{background:none;border:0;color:var(--bad);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(5,12,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:30}
[dir=ltr]{direction:ltr}
</style>
</head>

var CR=null,unsub=null;
document.addEventListener("click",async function(e){
  var el=e.target.closest("[data-act]");if(!el)return;var a=el.dataset.act,v=el.dataset.v,er;
  if(a==="lang"){L=+v;save();render()}

  else if(a==="back"){S.otp=0;render()}

    if(!/^03\d{9}$/.test(p)){er.textContent=t("e1");return}

    try{if(!window.rcv)window.rcv=new RecaptchaVerifier(auth,"rc",{size:"invisible"});
      CR=await signInWithPhoneNumber(auth,"+92"+p.slice(1),window.rcv);S.phone=p;S.otp=1;render()}
    catch(x){el.disabled=false;er.textContent=t("e5")+" ["+((x&&x.code)||x)+"]";try{window.rcv.clear()}catch(_){}window.rcv=null}}
  else if(a==="login"){er=document.getElementById("er");var o=document.getElementById("ot").value.trim(),n=document.getElementById("nm").value.trim();

    S.newName=n;el.disabled=true;
    try{await CR.confirm(o)}catch(x){el.disabled=false;er.textContent=t("e2")}}
});
onAuthStateChanged(auth,async function(u){
  if(unsub){unsub();unsub=null}
  if(!u){S.user=null;S.orders=[];S.tab="home";S.otp=0;render();return}
  var ref=doc(db,"users",u.uid),sn=await getDoc(ref);
  if(!sn.exists()){await setDoc(ref,{name:S.newName||"User",phone:S.phone||(u.phoneNumber||"").replace("+92","0"),role:"customer",created:Date.now()});sn=await getDoc(ref)}
  var d=sn.data();S.user={uid:u.uid,phone:d.phone,name:d.name,role:d.role};S.otp=0;
  var q=d.role==="worker"?query(collection(db,"orders")):query(collection(db,"orders"),where("uid","==",u.uid));
  unsub=onSnapshot(q,function(s){
    S.orders=s.docs.map(function(x){var o=x.data();o.id=x.id;return o}).filter(function(o){return d.role!=="worker"||o.status==="new"||o.wid===u.uid}).sort(function(a,b){return b.created-a.created});
    if(!document.querySelector(".sheet"))render()},function(){});
  render()});
